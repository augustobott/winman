name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v1.0.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Info.plist 2>/dev/null || echo "")
            if [ -n "${VERSION}" ]; then
              TAG="v${VERSION}"
            else
              TAG="latest"
            fi
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Build and Package WinMan
        run: make dist

      - name: Verify Distribution Artifacts
        run: |
          test -f WinMan.zip
          test -f WinMan.zip.sha256
          echo "SHA256: $(cat WinMan.zip.sha256)"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WinMan-macOS-${{ steps.version.outputs.tag }}
          path: |
            WinMan.zip
            WinMan.zip.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: WinMan ${{ steps.version.outputs.tag }}
          files: |
            WinMan.zip
            WinMan.zip.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
